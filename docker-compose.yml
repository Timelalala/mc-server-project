services:
  # 1. MySQL Database Service
  db:
    image: mysql:8.0
    container_name: mc-db
    restart: unless-stopped
    command: >
      mysqld
      --default-authentication-plugin=mysql_native_password
      --default-time-zone='+07:00'
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mc_db_secret_pass_2026}
      MYSQL_DATABASE: ${DB_NAME:-mc_server_db}
      TZ: ${TZ:-Asia/Bangkok}
    ports:
      # ย้าย Host Port เป็น 3307 เพื่อเลี่ยงพอร์ตชนกับ MySQL บนเครื่อง Windows
      # (ภายใน Container Network ยังคุยกันผ่านพอร์ต 3306 ตามเดิม)
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-mc_db_secret_pass_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mc-network

  # 2. Backend Application Service (Express + MySQL + Socket.IO)
  backend:
    build:
      context: ./mc-server-backend
      dockerfile: Dockerfile
    container_name: mc-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      TZ: ${TZ:-Asia/Bangkok}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASS:-mc_db_secret_pass_2026}
      DB_NAME: ${DB_NAME:-mc_server_db}
      JWT_SECRET: ${JWT_SECRET:-mc_server_super_secret_jwt_key_change_in_production}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      MC_API_KEY: ${MC_API_KEY:-your_cluster_secret_key_here}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://127.0.0.1,http://localhost:80,http://localhost:5173}
      OMISE_PUBLIC_KEY: ${OMISE_PUBLIC_KEY:-}
      OMISE_SECRET_KEY: ${OMISE_SECRET_KEY:-}
      EASYSLIP_API_KEY: ${EASYSLIP_API_KEY:-}
      EASYSLIP_BANK_ACCOUNT: ${EASYSLIP_BANK_ACCOUNT:-}
    ports:
      # Keep 127.0.0.1:5000 for Reverse SSH Tunnel from MC1 (DO NOT CHANGE)
      - "127.0.0.1:5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mc-network


  # 3. Cloudflare Quick Tunnel Service (เชื่อมต่อ Backend พอร์ต 5000 ให้ Vercel เรียกใช้งาน)
  mc-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: mc-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://backend:5000
    depends_on:
      - backend
    networks:
      - mc-network

  # 4. Frontend Web Service (React + Vite + Nginx) - สำหรับเปิดเทสต์ในเครื่อง
  frontend:
    build:
      context: ./mc-server-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: mc-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - mc-network

volumes:
  mysql_data:
  backend_uploads:

networks:
  mc-network:
    driver: bridge
